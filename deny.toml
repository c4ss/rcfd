# cargo-deny configuration: `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny).
# Run in CI by the deny job (licences, bans, sources). The allowed licences are the ones THIRD_PARTY_LICENSES.md lists for Cargo.lock; a dependency
# change that brings in another licence fails here until it is reviewed and added.

[advisories]
# Advisories in the RustSec database fail the check; yanked crates only warn.
yanked = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    # webpki-roots: certificate-authority data; the licence text must ship with binaries (THIRD_PARTY_LICENSES.md).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The exception for egui's default fonts (epaint_default_fonts: OFL-1.1, Ubuntu-font-1.0) went with the egui desktop apps
# rcfd-studio and rcfd-gui (F-449).
exceptions = []

[licenses.private]
# Workspace crates are publish = false and licensed AGPL-3.0-only (Cargo.toml).
ignore = true

[bans]
# Report several versions of one crate without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
