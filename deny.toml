# cargo-deny configuration: `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny).
# Run in CI by the deny job (licences, bans, sources). The allowed licences are the ones THIRD_PARTY_LICENSES.md lists for Cargo.lock; a dependency
# change that brings in another licence fails here until it is reviewed and added.

[advisories]
# Advisories in the RustSec database fail the check; yanked crates only warn.
yanked = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    # webpki-roots: certificate-authority data; the licence text must ship with binaries (THIRD_PARTY_LICENSES.md).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = [
    # egui's default fonts, in epaint_default_fonts since egui 0.36 (both desktop apps: ADR 0131 amendment 1, ADR 0165);
    # SPDX id of the Ubuntu Font Licence. Their licence texts must ship with binaries (THIRD_PARTY_LICENSES.md). The epaint
    # exception for egui 0.27 (fonts inside epaint) went with egui 0.27 (ADR 0165).
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Workspace crates are publish = false and licensed AGPL-3.0-only (Cargo.toml).
ignore = true

[bans]
# wgpu and egui pull in several versions of some crates; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
