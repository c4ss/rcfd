# Sod shock tube (Sod 1978) with the compressible Euler solver: HLLC flux,
# van Leer limited linear reconstruction, third-order SSP Runge-Kutta, CFL 0.4.
# One cell wide in y; the end states are held by fixed boundaries. The exact
# solution (rho, u, p over x at t = 0.2) is the Riemann problem of the two
# states below.
title = "Sod shock tube"

[mesh]
generator = "box_2d"
nx = 100
ny = 1
lx = 1.0
ly = 0.01

[solver]
algorithm = "compressible"
end_time = 0.2

[compressible]
flux = "hllc"
reconstruction = "tvd_van_leer"
rk_order = 3
cfl = 0.4
gamma = 1.4

[compressible.initial]
mode = "riemann"
split_axis = "x"
split_position = 0.5

[compressible.initial.left]
density = 1.0
pressure = 1.0

[compressible.initial.right]
density = 0.125
pressure = 0.1

[boundaries.xmin]
compressible_bc = "fixed"
density_value = 1.0
pressure_value = 1.0

[boundaries.xmax]
compressible_bc = "fixed"
density_value = 0.125
pressure_value = 0.1

[reports.rho_max]
type = "maximum"
field = "rho"

[reports.p_probe]
type = "probe"
field = "p"
point = [0.75, 0.005, 0.005]
