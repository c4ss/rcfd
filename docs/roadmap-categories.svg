<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 644" width="746" role="img" aria-labelledby="t d">
  <title id="t">Roadmap progress by area</title>
  <desc id="d">Done, partly done and not started roadmap items in each of 15 areas. Numerics and solvers: 28 of 45 done; Turbulence: 7 of 16 done; Heat, materials and chemistry: 13 of 25 done; Compressible flow and acoustics: 9 of 26 done; Multiphase and particles: 4 of 16 done; Moving meshes, rotors and coupling: 33 of 72 done; Structural solver: 41 of 115 done; Parallel and GPU: 2 of 4 done; Meshing and mesh formats: 18 of 30 done; Post-processing and output: 10 of 12 done; Design studies and optimisation: 3 of 10 done; Command line, Python and API: 13 of 16 done; Claude and the MCP server: 8 of 21 done; Studio desktop app: 6 of 17 done; Quality, docs and validation: 1 of 7 done.</desc>
