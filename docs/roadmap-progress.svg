<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" width="720" role="img" aria-labelledby="t d">
  <title id="t">Roadmap progress</title>
  <desc id="d">150 of 368 roadmap items are done, 110 are partly done and 108 are not started.</desc>
  <style>
    :root { --ink:#1f2328; --mute:#59636e; --done:#1a7f4b; --part:#d4a72c; --todo:#d0d7de; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#f0f3f6; --mute:#9198a1; --done:#3fb97a; --part:#e0b341; --todo:#3d444d; --bg:#0d1117; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .big { font-size: 34px; font-weight: 700; }
    .sub { font-size: 15px; fill: var(--mute); }
    .lab { font-size: 14px; font-weight: 600; }
    .row { font-size: 14px; }
    .num { font-size: 13px; fill: var(--mute); }
    .fam { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: var(--mute); }
  </style>
  <rect width="720" height="176" fill="var(--bg)"/>
  <defs>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--part)"/>
      <rect width="3" height="8" fill="var(--bg)" opacity="0.35"/>
    </pattern>
    <clipPath id="r"><rect x="24" y="78" width="672" height="44" rx="6"/></clipPath>
  </defs>
  <text x="24" y="40" class="big">41% done</text>
  <text x="220" y="40" class="sub">150 of 368 roadmap items finished, 110 more under way</text>
  <g clip-path="url(#r)">
    <rect x="24" y="78" width="273.9" height="44" fill="var(--done)"/>
    <rect x="297.9" y="78" width="200.9" height="44" fill="url(#h)"/>
    <rect x="498.8" y="78" width="197.2" height="44" fill="var(--todo)"/>
  </g>
  <text x="24" y="148" class="lab">Done</text>
  <text x="24" y="166" class="num">150</text>
  <text x="297.9" y="148" class="lab">Partly done</text>
  <text x="297.9" y="166" class="num">110</text>
  <text x="696" y="148" class="lab" text-anchor="end">Not started</text>
  <text x="696" y="166" class="num" text-anchor="end">108</text>
</svg>
