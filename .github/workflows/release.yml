# On a pushed tag vX.Y.Z: check the tag against the repository and open a DRAFT GitHub release whose notes are the CHANGELOG
# section of that version. The maintainer publishes the draft by hand (docs/releasing.md). No binaries, nothing published elsewhere.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: check versions and extract notes
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/notes.md"
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "rcfd ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
