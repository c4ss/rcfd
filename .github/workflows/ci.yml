# Checks on every pull request and every push to main. They are fast on purpose and do NOT replace the full gate:
# integration tests (crates/*/tests) run only in gate.yml. See docs/releasing.md for what each job proves.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to the same pull request makes the older run useless; runs on main are kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain the project's gate uses. Change it together with gate.yml and docs/releasing.md.
  RUST_GATE_TOOLCHAIN: "1.99.0"
  # The oldest toolchain README.md promises for the workspace.
  RUST_MIN_TOOLCHAIN: "1.90.0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_GATE_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (all targets, warnings are errors)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_GATE_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      # --all-targets type-checks every integration test too, so a test that no longer compiles fails here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  unit-tests:
    name: unit tests, ${{ matrix.os }} (integration tests run only in the full gate)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        # Windows costs about twice the wall time; it runs on main and on demand, not on every pull request.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'windows-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_GATE_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      # The runner unit tests start the real `rcfd` binary from the same target directory, and `--lib --bins` does
      # not build it for a library test.
      - run: cargo build --release --locked -p rcfd-cli
      # Release, like the gate: numeric limits and timing checks were measured in release.
      # --lib --bins is cargo's own selection (the tests inside src/), not a hand-picked list.
      - run: cargo test --workspace --release --locked --lib --bins --no-fail-fast

  min-toolchain:
    name: type-checks with Rust 1.90 (README minimum; the Studio needs 1.95)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_MIN_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      # No -D warnings: lint names newer than 1.90 would warn here without anything being wrong.
      # The whole workspace since the egui apps rcfd-studio and rcfd-gui, which needed 1.95, were removed (F-449). The job
      # keeps its name so a required check of that name still matches.
      - run: cargo check --workspace --all-targets --locked

  deny:
    name: dependency licences and sources (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisories are left out: a new RustSec entry must not fail an unrelated pull request.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check licenses bans sources

  scripts:
    name: gate and release script self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      # Every scripts/test_*.py, so a new test file needs no edit here (docs/process/documentation-process-review.md, I1).
      - run: python -m unittest discover -s scripts -p "test_*.py"
      # The generated pages are current, and the lints of the process report hold (sections a, b, e, k, l; no git history).
      - run: python scripts/process_report.py --check

  # The Electron Studio (apps/studio-web, ADR 0800 Q3: its npm tests run here, not in scripts/gate_test.py). npm ci installs
  # the committed lock file exactly; npm test builds, packages the app into out/packaged/ and runs every Playwright test
  # (unit and e2e on the packaged app, ADR 0801 addendum 1). Any failed step or test fails the workflow.
  # Both systems on every pull request: the job takes minutes, not the hour of the Rust unit tests, and Windows is the
  # maintainer's platform and the one where the e2e test also reads the renderer's OS sandbox back (not on Linux).
  studio-web:
    name: studio-web (npm ci, type checks, build, Playwright on the packaged Studio), ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/studio-web
    env:
      # The Node release the Studio was verified on (ADR 0801 sections 5 and addendum 1); package.json asks for >=22.12.0.
      # Change it together with docs/test-process.md section 7.
      STUDIO_NODE_VERSION: "22.19.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.STUDIO_NODE_VERSION }}
          # npm's download cache only, keyed on the lock file; node_modules, builds and test results are never cached.
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: let Chromium use its user-namespace sandbox (Ubuntu 24.04 AppArmor)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 can forbid unprivileged user namespaces, which Chromium's sandbox needs. This changes the runner, not
        # the app: the Studio keeps its sandbox on and the tests check that it does (guardrail G10; never --no-sandbox).
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
      # This job builds no Rust, so out/packaged has no engine beside it (scripts/package-dir.mjs fails without one unless
      # told; ADR 0801 Addendum 21). The tests that need the engine are skipped with the reason, as before.
      - run: npm run package:dir -- --no-engine
      - name: Playwright (unit and e2e on the packaged app)
        # Linux has no display on the runner: Electron runs under a virtual one (xvfb). On Windows the window opens on the
        # runner's desktop for a few seconds; no human step either way. The HTML report is for the failure upload below.
        # What npm test runs after its build and packaging (both done by the steps above).
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx playwright test --reporter=list,html
          else
            npx playwright test --reporter=list,html
          fi
      - name: upload the Playwright report and test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-web-${{ matrix.os }}-${{ github.sha }}
          path: |
            apps/studio-web/playwright-report/
            apps/studio-web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # THIRD_PARTY_LICENSES.md lists the npm lock file too (ADR 0801 Q4); the script reads Cargo.lock through
      # `cargo metadata --offline`, so the registry is fetched first. Once is enough: the list does not depend on the runner.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: runner.os == 'Linux'
        with:
          toolchain: ${{ env.RUST_GATE_TOOLCHAIN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux'
        with:
          python-version: "3.x"
      - name: third-party licence list is up to date
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          cargo fetch --locked
          python scripts/third_party_licenses.py --check
