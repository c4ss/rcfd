[package]
name = "rcfd-mcp"
description = "MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
# The dependency closure needs Rust 1.85 (toml 1.1; cargo metadata rust_version fields).
rust-version = "1.85"
publish = false

[lints]
workspace = true

[dependencies]
rcfd-api.workspace = true
rcfd-io.workspace = true
serde_json.workspace = true
# Project tools behind --project (ADR 0135 W48-12 (a)): their commands and queries are the project workspace's (ADR 0173
# W2, ADR 0185 E3); this crate keeps their MCP descriptors.
rcfd-workspace.workspace = true
# Project folder, run service client, field store reader, and the CPU renderer of render_image (amendment 1 item 13).
# All lower layers, no third-party crate added.
rcfd-project.workspace = true
rcfd-runner = { path = "../rcfd-runner" }
rcfd-tsstore.workspace = true
rcfd-post.workspace = true

[dev-dependencies]
# F2 (ADR 0135): tool names checked with the allow-list rules of the Claude Code bridge (read only, layer 2).
rcfd-claude = { path = "../rcfd-claude" }

[[bin]]
name = "rcfd-mcp"
path = "src/main.rs"
