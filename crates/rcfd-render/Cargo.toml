[package]
name = "rcfd-render"
description = "Studio render core (L4): wgpu offscreen rendering of surface meshes with scalar colouring (ADR 0125)"
version.workspace = true
edition.workspace = true
license.workspace = true
# The dependency closure needs Rust 1.90 (ordered-float 5.5 via wgpu 30; cargo metadata rust_version fields).
rust-version = "1.90"
publish = false

[lints]
workspace = true

[dependencies]
rcfd-core.workspace = true
rcfd-mesh.workspace = true
rcfd-post.workspace = true
png.workspace = true

[dependencies.wgpu]
version = "=30.0.1"
default-features = false
features = ["std", "wgsl", "dx12", "vulkan"]
