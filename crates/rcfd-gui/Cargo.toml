[package]
name = "rcfd-gui"
description = "rcfd desktop app: eframe/egui shell with dockable panels, settings editor, monitors, viewport and assistant sidebar"
version.workspace = true
edition.workspace = true
license.workspace = true
# The dependency closure needs Rust 1.89 (uuid 1.28; cargo metadata rust_version fields).
rust-version = "1.89"
publish = false

[lints]
workspace = true

[dependencies]
rcfd-api.workspace = true
rcfd-assistant.workspace = true
rcfd-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
eframe = { version = "0.27.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.27.2"
egui_dock = { version = "0.12.0", features = ["serde"] }
egui_plot = "0.27.2"
rfd = "=0.17.2"

[[bin]]
name = "rcfd-gui"
path = "src/main.rs"
