[package]
name = "rcfd-gui"
description = "rcfd desktop app: eframe/egui shell with dockable panels, settings editor, monitors, viewport and assistant sidebar"
version.workspace = true
edition.workspace = true
license.workspace = true
# eframe 0.36 needs Rust 1.95 (ADR 0165 S4, as the Studio: ADR 0131 W48-1 (b)); the rest of the workspace keeps its own minimums.
rust-version = "1.95"
publish = false

[lints]
workspace = true

[dependencies]
rcfd-api.workspace = true
rcfd-assistant.workspace = true
rcfd-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
# ADR 0165 (Dependabot 7, 8, 10): the Studio's egui set (ADR 0131 W48-2 (a), eframe 0.36.2), so the workspace has one.
# Back end glow (OpenGL), as before; the packages are already locked for eframe 0.36.2. A build together with the Studio
# also turns on eframe's wgpu, so main.rs asks for glow explicitly (ADR 0165 S2).
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
egui_plot = "0.37.0"
rfd = "=0.15.4"

[[bin]]
name = "rcfd-gui"
path = "src/main.rs"
