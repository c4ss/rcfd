[package]
name = "rcfd-gpu"
description = "CUDA device linear solvers (feature `cuda`, off by default; ADR 0038)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# This crate does NOT inherit the workspace lint table: the workspace sets `unsafe_code = "forbid"`, which cannot be
# relaxed inside a crate. Every other lint entry is copied from the workspace; `unsafe_code` is `deny` here and is
# allowed only in `src/cuda/launch.rs` (kernel launches). ADR 0038 D2.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_range_loop = "allow"
too_many_arguments = "allow"
undocumented_unsafe_blocks = "deny"

[features]
default = []
# Compile the CUDA backend (dynamic loading; no CUDA toolkit is needed to build, only to run).
cuda = ["dep:cudarc"]

[dependencies]
rcfd-linalg.workspace = true

[dependencies.cudarc]
version = "=0.19.10"
default-features = false
features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13040"]
optional = true

[[example]]
name = "gpu_bench"
required-features = ["cuda"]
