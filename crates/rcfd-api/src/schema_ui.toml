# UI metadata of the case schema (F-826, ADR 0730). Read by crates/rcfd-api/src/ui.rs with include_str! and laid
# onto the JSON Schema export by `settings.schema {ui: true}` (rcfd serve --ui) and `rcfd schema --ui`. Validation,
# parsing, unit conversion and hashing never read this file.
#
# Keys are dotted schema paths, `*` for a named entry (boundaries.*.velocity). Each entry may give:
#   label        a short human name (x-rcfd-label)
#   help         one line of help, at most 160 characters, plain words (x-rcfd-help); without it the engine falls
#                back to the first sentence of the `see` docs section, else of the key's schema text
#   unit         a display unit, only for a node with neither x-rcfd-unit nor an SI dimension (a count, a list)
#   see          the docs page and heading slug that explain the key (x-rcfd-see); the page must be built in
#   advanced     the reason the key sits one step away (x-rcfd-advanced = true); absent means common
#   recommended  {minimum, maximum, source}: a usual working range, ONLY with a cited source: public literature
#                (author, title, year) or a validation ADR of this repository. No source, no range.
#
# tests/ui_metadata_adr0730.rs checks every path against the schema, every range against the hard range, every
# help line and every `see` heading, and reports the help coverage.

