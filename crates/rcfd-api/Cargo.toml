[package]
name = "rcfd-api"
description = "Solver service API"
version.workspace = true
edition.workspace = true
license.workspace = true
# The dependency closure needs Rust 1.85 (toml 1.1; cargo metadata rust_version fields).
rust-version = "1.85"
publish = false

[lints]
workspace = true

[features]
default = []
# Device linear solvers (CUDA); off by default (ADR 0038).
cuda = ["rcfd-fv/cuda", "rcfd-gpu/cuda"]

[dependencies]
rcfd-core.workspace = true
rcfd-fv.workspace = true
rcfd-gpu.workspace = true
rcfd-io.workspace = true
rcfd-linalg.workspace = true
rcfd-mesh.workspace = true
rcfd-particles.workspace = true
rcfd-post.workspace = true
rcfd-reactor.workspace = true
rcfd-tsstore.workspace = true
rcfd-turb.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
wasmi.workspace = true

[dev-dependencies]
wat = "1"
