[package]
name = "rcfd-claude"
description = "Claude Code bridge (Studio layer L6): session discovery, tolerant transcript tail, headless chat driver with an allow-list"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
