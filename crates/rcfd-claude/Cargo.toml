[package]
name = "rcfd-claude"
description = "Claude Code bridge (Studio layer L6): session discovery, tolerant transcript tail, headless chat driver with an allow-list"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Atomic file replacement and path canonicalization (ADR 0134 Placement; layer 2 above rcfd-project).
rcfd-project = { path = "../rcfd-project" }

# Test-only replay double of the `claude` executable (ADR 0126); the driver never calls it unless a test passes its path.
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"
test = false
doc = false
