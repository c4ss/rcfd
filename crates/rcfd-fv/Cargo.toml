[package]
name = "rcfd-fv"
description = "Finite-volume discretisation and solvers"
version.workspace = true
edition.workspace = true
license.workspace = true
# The dependency closure needs Rust 1.80 (rayon 1.12; cargo metadata rust_version fields).
rust-version = "1.80"
publish = false

[lints]
workspace = true

[features]
default = []
# Device linear solvers (CUDA); off by default (ADR 0038).
cuda = ["rcfd-gpu/cuda"]

[dependencies]
rcfd-core.workspace = true
rcfd-mesh.workspace = true
rcfd-linalg.workspace = true
rcfd-gpu.workspace = true
rayon.workspace = true
