[package]
name = "rcfd-cli"
description = "Command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
# The dependency closure needs Rust 1.85 (toml 1.1; cargo metadata rust_version fields).
rust-version = "1.85"
publish = false

[lints]
workspace = true

[features]
default = []
# Device linear solvers (CUDA); off by default (ADR 0038).
cuda = ["rcfd-api/cuda"]

[dependencies]
rcfd-core.workspace = true
rcfd-mesh.workspace = true
rcfd-io.workspace = true
rcfd-post.workspace = true
rcfd-reactor.workspace = true
rcfd-fv.workspace = true
rcfd-api.workspace = true
# ADR 0731 Q1 (a): `rcfd project init` makes a project folder through the workspace layer (a workspace crate; no
# third-party crate added). rcfd-project is a dev-dependency only: the tests open what the command made.
rcfd-workspace.workspace = true
serde_json.workspace = true

[[bin]]
name = "rcfd"
path = "src/main.rs"

[dev-dependencies]
serde_json.workspace = true
rcfd-project.workspace = true
