[package]
name = "rcfd-cli"
description = "Command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Device linear solvers (CUDA); off by default (ADR 0038).
cuda = ["rcfd-api/cuda"]

[dependencies]
rcfd-core.workspace = true
rcfd-mesh.workspace = true
rcfd-io.workspace = true
rcfd-post.workspace = true
rcfd-reactor.workspace = true
rcfd-fv.workspace = true
rcfd-api.workspace = true
serde_json.workspace = true

[[bin]]
name = "rcfd"
path = "src/main.rs"

[dev-dependencies]
serde_json.workspace = true
