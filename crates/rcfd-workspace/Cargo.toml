[package]
name = "rcfd-workspace"
description = "The workspace layer of a project folder (ADR 0173, ADR 0185): the commands, queries and write rule the MCP server and the Studio share"
version.workspace = true
edition.workspace = true
license.workspace = true
# As rcfd-mcp: the dependency closure of rcfd-api needs Rust 1.85 (toml 1.1).
rust-version = "1.85"
publish = false

[lints]
workspace = true

# ADR 0173 D1 (a): above api and below mcp and the Studio. All workspace crates already used by rcfd-mcp's project
# tools; no third-party crate added (rcfd-io and rcfd-mesh joined with the mesh commands of W4, ADR 0187).
[dependencies]
rcfd-api.workspace = true
rcfd-project.workspace = true
rcfd-runner = { path = "../rcfd-runner" }
rcfd-tsstore.workspace = true
rcfd-post.workspace = true
serde_json.workspace = true
# ADR 0186 G1: the shipped examples moved from the Studio read their TOML into a tree (`Example::parse`). Already in the
# workspace (rcfd-api, rcfd-studio); not a new crate.
toml.workspace = true
# ADR 0187 M9: the mesh commands of W4 read mesh files with the readers a case's mesh build uses and check the mesh with
# its quality report. Both below api in the layering rule; not new crates.
rcfd-io.workspace = true
rcfd-mesh.workspace = true
